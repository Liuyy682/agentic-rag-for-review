name: Extended tests

on:
  workflow_dispatch:
    inputs:
      run_real_models:
        description: Download and run the real embedding and reranker models
        required: true
        type: boolean
        default: true
      run_llm_smoke:
        description: Make one DeepSeek smoke-test request when the secret exists
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/huggingface
      DENSE_LOCAL_FILES_ONLY: "true"
      RERANKER_LOCAL_FILES_ONLY: "true"
      RUN_REAL_MODEL_TESTS: ${{ inputs.run_real_models && '1' || '0' }}
      RUN_REAL_LLM_TESTS: ${{ inputs.run_llm_smoke && '1' || '0' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Restore Hugging Face cache
        if: inputs.run_real_models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-bge-${{ runner.os }}-${{ hashFiles('src/agentic_rag/config.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Download configured models
        if: inputs.run_real_models
        env:
          HF_HUB_OFFLINE: "0"
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          for model in ("BAAI/bge-base-zh-v1.5", "BAAI/bge-reranker-base"):
              snapshot_download(repo_id=model, cache_dir=os.environ["HF_HUB_CACHE"])
          PY

      - name: Run real model tests offline
        if: inputs.run_real_models
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q tests/integration/external/test_real_models.py

      - name: Report missing DeepSeek secret
        if: inputs.run_llm_smoke && env.DEEPSEEK_API_KEY == ''
        run: echo "::notice::DEEPSEEK_API_KEY is not configured; skipping the LLM smoke test."

      - name: Run DeepSeek smoke test
        if: inputs.run_llm_smoke && env.DEEPSEEK_API_KEY != ''
        run: python -m pytest -q tests/integration/external/test_llm_smoke.py
