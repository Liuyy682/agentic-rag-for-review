name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      AUTH_JWT_SECRET: ci-only-secret-with-at-least-32-characters
      AUTH_TENANT_ID: ci-tenant
      DATABASE_URL: postgresql://agentic_rag:dev_only@localhost:5432/agentic_rag
      RUN_PG_STORAGE_TESTS: "1"
      HF_HUB_OFFLINE: "1"
      DENSE_LOCAL_FILES_ONLY: "true"
      RERANKER_LOCAL_FILES_ONLY: "true"
      IMAGE_ANALYSIS_ENGINE: none
      LANGFUSE_ENABLED: "false"

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agentic_rag
          POSTGRES_PASSWORD: dev_only
          POSTGRES_DB: agentic_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_rag -d agentic_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src evaluation tests

      - name: Run tests
        run: python -m pytest -q
