[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-for-review"
version = "0.1.0"
description = "Agentic RAG for local course materials and documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=23.1.0,<24.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_rag = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
